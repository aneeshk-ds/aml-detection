aml_detection:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: aml.duckdb
      threads: 2
      settings:
        memory_limit: "2GB"
        temp_directory: ".duckdb_tmp"
        preserve_insertion_order: false
    ci:
      type: duckdb
      path: ci_aml.duckdb
      threads: 1
      settings:
        memory_limit: "2GB"
        preserve_insertion_order: false
